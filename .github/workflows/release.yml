name: Release

on:
  repository_dispatch:
    types: [positron-release]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      positron_ref:
        description: 'Positron branch/tag to build against'
        required: true
        default: 'main'
        type: string
      dry_run:
        description: 'Dry run - builds but skips publish'
        required: false
        default: false
        type: boolean
      force:
        description: 'Force release even if Positron version unchanged'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # required for npm trusted publishing (OIDC)

    env:
      # Resolve inputs - repository_dispatch uses payload, workflow_dispatch uses inputs
      POSITRON_REF: ${{ github.event.client_payload.ref || inputs.positron_ref || 'main' }}
      VERSION_TYPE: ${{ inputs.version_type || 'patch' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      FORCE: ${{ inputs.force || false }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          # positron-bot is managed in rstudio/github-iac as the app
          # "positron-projects"; its credentials are distributed as the Actions
          # secrets POSITRON_PROJECTS_APP_ID / POSITRON_PROJECTS_PEM.
          app-id: ${{ secrets.POSITRON_PROJECTS_APP_ID }}
          private-key: ${{ secrets.POSITRON_PROJECTS_PEM }}

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          # Use the positron-bot App token so the release PR is opened and
          # merged by the App identity. A GitHub App token can create PRs even
          # though the org disables "Allow GitHub Actions to create and approve
          # pull requests" -- that setting only restricts GITHUB_TOKEN. Merging
          # the PR then satisfies the branch ruleset, so no bypass is needed.
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Shallow clone Positron repo
        run: |
          git clone --depth 1 --branch ${{ env.POSITRON_REF }} \
            https://github.com/posit-dev/positron.git ../positron

      - name: Check if Positron version already released
        id: check_version
        run: |
          POSITRON_VERSION=$(jq -r '.positronVersion' ../positron/product.json)
          echo "positron_version=$POSITRON_VERSION" >> "$GITHUB_OUTPUT"
          echo "Positron version: $POSITRON_VERSION"

          # Check if this Positron version is already in the README compatibility table
          if grep -q "| $POSITRON_VERSION" README.md; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Positron $POSITRON_VERSION already has a release"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
            echo "✓ New Positron version detected"
          fi

      - name: Skip release (no changes)
        if: ${{ steps.check_version.outputs.already_released == 'true' && env.FORCE == 'false' }}
        run: |
          echo "## Release Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Positron version **${{ steps.check_version.outputs.positron_version }}** already has a published release." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To release anyway (e.g., for package-only fixes), re-run with **force** checked." >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: Set up Node.js
        if: ${{ steps.check_version.outputs.already_released == 'false' || env.FORCE == 'true' }}
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing (OIDC) requires Node >=22.14.0 and npm
          # >=11.5.1; the npm upgrade happens just before the publish step.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: ${{ steps.check_version.outputs.already_released == 'false' || env.FORCE == 'true' }}
        run: npm ci

      - name: Build
        if: ${{ steps.check_version.outputs.already_released == 'false' || env.FORCE == 'true' }}
        run: npm run build

      - name: Run tests
        if: ${{ steps.check_version.outputs.already_released == 'false' || env.FORCE == 'true' }}
        run: npm run test:coverage

      - name: Bump version
        if: ${{ steps.check_version.outputs.already_released == 'false' || env.FORCE == 'true' }}
        id: bump_version
        run: |
          npm version ${{ env.VERSION_TYPE }} --no-git-tag-version
          NEW_VERSION=$(jq -r '.version' package.json)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New package version: $NEW_VERSION"

      - name: Update README compatibility table
        if: ${{ steps.check_version.outputs.already_released == 'false' || env.FORCE == 'true' }}
        run: |
          POSITRON_VERSION="${{ steps.check_version.outputs.positron_version }}"
          PACKAGE_VERSION="${{ steps.bump_version.outputs.version }}"

          # Add new row to compatibility table if not already present
          if ! grep -q "| $PACKAGE_VERSION |" README.md; then
            # Insert new row after the header separator line
            sed -i "/^|.*-.*|.*-.*|$/a | $PACKAGE_VERSION | $POSITRON_VERSION+ |" README.md
          fi

      - name: Configure git
        if: ${{ steps.check_version.outputs.already_released == 'false' || env.FORCE == 'true' }}
        run: |
          git config user.name "positron-projects[bot]"
          git config user.email "210906922+positron-projects[bot]@users.noreply.github.com"

      - name: Open release PR, merge, and tag
        if: ${{ (steps.check_version.outputs.already_released == 'false' || env.FORCE == 'true') && env.DRY_RUN == 'false' }}
        env:
          VERSION: ${{ steps.bump_version.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="release/v${VERSION}"

          # main requires changes to go through a PR, so commit to a release
          # branch and merge via PR instead of pushing to main directly.
          git checkout -b "$BRANCH"
          git add package.json package-lock.json README.md
          git commit -m "Release v${VERSION}"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release v${VERSION}" \
            --body "Automated release of @posit-dev/positron v${VERSION}."

          # Immediate squash merge. Requires main to have no required approvals
          # (positron-bot can't approve its own PR) and no required status
          # checks (this merges right away, before any check could finish);
          # otherwise it fails here by design rather than half-releasing.
          #
          # If required checks are added later: this PR is opened by a GitHub
          # App (not GITHUB_TOKEN), so check workflows DO trigger on it. Switch
          # to `--auto --squash` and move publish/tag into a second workflow
          # keyed on the merge to main, since the merge then becomes async.
          gh pr merge "$BRANCH" --squash --delete-branch

          # Tag the merged commit on main. Tags aren't covered by the branch
          # ruleset, so this push is allowed.
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Upgrade npm for trusted publishing
        if: ${{ (steps.check_version.outputs.already_released == 'false' || env.FORCE == 'true') && env.DRY_RUN == 'false' }}
        run: npm install -g npm@latest

      - name: Publish to npm
        if: ${{ (steps.check_version.outputs.already_released == 'false' || env.FORCE == 'true') && env.DRY_RUN == 'false' }}
        # Publishes via npm trusted publishing (OIDC) using the id-token
        # permission above -- no NPM_TOKEN secret needed.
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        if: ${{ (steps.check_version.outputs.already_released == 'false' || env.FORCE == 'true') && env.DRY_RUN == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.version }}
          name: v${{ steps.bump_version.outputs.version }}
          body: |
            ## @posit-dev/positron v${{ steps.bump_version.outputs.version }}

            Built against Positron ${{ steps.check_version.outputs.positron_version }}

            ### Installation
            ```bash
            npm install @posit-dev/positron@${{ steps.bump_version.outputs.version }}
            ```
          generate_release_notes: true

      - name: Dry run summary
        if: ${{ (steps.check_version.outputs.already_released == 'false' || env.FORCE == 'true') && env.DRY_RUN == 'true' }}
        run: |
          echo "## Dry Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build and tests passed" >> $GITHUB_STEP_SUMMARY
          echo "📦 Would publish version: ${{ steps.bump_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Built against Positron: ${{ steps.check_version.outputs.positron_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No changes were pushed (dry run mode)" >> $GITHUB_STEP_SUMMARY
